<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Vendors — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.set-scroll .table-wrap{margin:0;}
.set-scroll .tfooter{margin:0;padding-top:14px;}

.cv-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.cv-search{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;max-width:420px;height:42px;
  padding:0 13px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;transition:border-color .15s;}
.cv-search:focus-within{border-color:var(--ac);}
.cv-search svg{width:15px;height:15px;color:var(--mu);flex-shrink:0;}
.cv-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--font);font-size:13px;}
.cv-search input::placeholder{color:var(--mu);}
.cv-add{display:flex;align-items:center;gap:7px;margin-left:auto;height:42px;padding:0 18px;background:var(--ac);
  border:none;border-radius:10px;color:#fff;font:600 13px/1 var(--font);cursor:pointer;transition:background .15s;white-space:nowrap;}
.cv-add:hover{background:var(--ac2);}
.cv-add svg{width:14px;height:14px;}

.cv-email{color:var(--ac2);}
.cv-subject{color:var(--tx);}
.cv-group{color:var(--tx2);}
.cv-kebab{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:transparent;border:none;border-radius:7px;color:var(--mu);cursor:pointer;transition:background .12s,color .12s;}
.cv-kebab:hover{background:var(--hover);color:var(--tx);}
.cv-kebab svg{width:15px;height:15px;}
.cv-menu{display:none;position:fixed;z-index:200;min-width:150px;background:var(--sur);
  border:0.5px solid var(--brd2);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;}
.cv-menu.open{display:block;}
.cv-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:0 13px;min-height:38px;
  background:none;border:none;border-bottom:0.5px solid var(--brd);color:var(--tx);
  font:500 12.5px/1 var(--font);cursor:pointer;text-align:left;}
.cv-menu-item:last-child{border-bottom:none;}
.cv-menu-item:hover{background:var(--hover);color:var(--ac2);}
.cv-menu-item.danger:hover{color:var(--rd);}
.cv-menu-item svg{width:14px;height:14px;color:var(--mu);flex-shrink:0;}
.cv-menu-item:hover svg{color:inherit;}
.cv-empty{padding:34px 12px;text-align:center;color:var(--mu);font-size:12.5px;}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
  </div>

  <div class="set-scroll">

    <div class="cv-bar">
      <label class="cv-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input id="cv-search" placeholder="Search CRM vendors..." oninput="cvSearchChanged()"/>
      </label>
      <button class="cv-add" onclick="cvOpenAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add CRM Vendor
      </button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:70px;">No.</th>
              <th style="width:320px;">Email</th>
              <th>Email Subject</th>
              <th style="width:190px;">Group Name</th>
              <th style="width:110px;text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="cv-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="tfooter">
      <span id="cv-range">0–0 of 0</span>
      <div class="pgn" id="cv-pager"></div>
    </div>

  </div>
</div>

<!-- Row actions menu -->
<div class="cv-menu" id="cv-menu">
  <button class="cv-menu-item" onclick="cvMenuEdit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Edit
  </button>
  <button class="cv-menu-item danger" onclick="cvMenuDelete()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    Delete
  </button>
</div>

<!-- Add / edit vendor -->
<div class="modal-backdrop modal-fullscreen-mobile" id="cv-modal" onclick="if(event.target===this) cvClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="cv-modal-title">Add CRM Vendor</div>
      <button class="modal-close" onclick="cvClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div>
        <label class="modal-field-label" for="cv-email">Email</label>
        <div class="modal-field"><input id="cv-email" type="email" placeholder="leads@vendor.com"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="cv-subject">Email Subject</label>
        <div class="modal-field"><input id="cv-subject" placeholder="New Customer Inquiry"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="cv-group">Group Name</label>
        <div class="modal-field"><input id="cv-group" placeholder="e.g. TrueCar"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="cvClose()">Cancel</button>
      <button class="modal-save" id="cv-modal-save" onclick="cvSave()">Add vendor</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'CRM Vendors' });</script>
<script>
// The 10 rows from the design, then partner feeds to fill out the list
var VENDORS = [
  { email:'System@dealercentric.com', subject:'DealerCentric ID Drive Scan', group:'dealercentric.com' },
  { email:'noreply@westlakefinancial.com', subject:'Customer pre-qualified from Westlake site', group:'Westlake' },
  { email:'truecar@leads.truecarmail.com', subject:'TrueCar / TrueCar: New Customer Inquiry', group:'TrueCar' },
  { email:'truecarforintuitcreditkarmamembers@leads.truecarmail.com', subject:'TrueCar / TrueCar for Intuit Credit Karma Members: New Customer Inquiry', group:'TrueCar' },
  { email:'perksatwork@leads.truecarmail.com', subject:'TrueCar / Perks At Work: New Customer Inquiry', group:'TrueCar' },
  { email:'corestream@leads.truecarmail.com', subject:'TrueCar / Corestream: New Customer Inquiry', group:'TrueCar' },
  { email:'truecarfordriversonuber@leads.truecarmail.com', subject:'TrueCar / TrueCar for Drivers on Uber: New Customer Inquiry', group:'TrueCar' },
  { email:'navyfederal@leads.truecarmail.com', subject:'TrueCar / Navy Federal: New Customer Inquiry', group:'TrueCar' },
  { email:'perkspot@leads.truecarmail.com', subject:'TrueCar / PerkSpot: New Customer Inquiry', group:'TrueCar' },
  { email:'ticketsatwork@leads.truecarmail.com', subject:'TrueCar / TicketsatWork: New Customer Inquiry', group:'TrueCar' }
];

// TrueCar runs many co-branded feeds; the rest are the usual lead providers
['AAA','Sam’s Club','Costco Auto','USAA','American Express','Chase','Capital One','PenFed',
 'Farm Bureau','AARP','BJ’s Wholesale','Consumer Reports','Liberty Mutual','Geico','State Farm',
 'Delta SkyMiles','United MileagePlus','Southwest Rapid Rewards','Marriott Bonvoy','Hilton Honors',
 'Verizon','AT&T','T-Mobile','Walmart','Target','Home Depot','Lowe’s','Best Buy','Kroger','Publix']
.forEach(function(partner){
  VENDORS.push({
    email: partner.toLowerCase().replace(/[^a-z0-9]/g, '') + '@leads.truecarmail.com',
    subject: 'TrueCar / ' + partner + ': New Customer Inquiry',
    group: 'TrueCar'
  });
});

[
  { group:'Cars.com',    domain:'cars.com',        subjects:['New Lead from Cars.com','Cars.com Trade-In Lead','Cars.com Finance Application'] },
  { group:'CarGurus',    domain:'cargurus.com',    subjects:['CarGurus: New Customer Inquiry','CarGurus Instant Market Value Lead','CarGurus Trade Offer'] },
  { group:'Autotrader',  domain:'autotrader.com',  subjects:['Autotrader New Lead','Autotrader Kelley Blue Book Instant Cash Offer','Autotrader Credit Application'] },
  { group:'CarsDirect',  domain:'carsdirect.com',  subjects:['CarsDirect New Customer Inquiry','CarsDirect Sub-Prime Lead','CarsDirect Payment Estimate'] },
  { group:'Edmunds',     domain:'edmunds.com',     subjects:['Edmunds New Lead','Edmunds Price Promise Lead','Edmunds Appraisal Request'] },
  { group:'KBB',         domain:'kbb.com',         subjects:['KBB Instant Cash Offer','KBB New Customer Inquiry','KBB Trade-In Valuation'] },
  { group:'Dealer.com',  domain:'dealer.com',      subjects:['Dealer.com Website Lead','Dealer.com Chat Transcript','Dealer.com Service Request'] },
  { group:'CarFax',      domain:'carfax.com',      subjects:['CarFax Used Car Listing Lead','CarFax History-Based Value Lead','CarFax Service Reminder Lead'] },
  { group:'Westlake',    domain:'westlakefinancial.com', subjects:['Westlake Credit Decision','Westlake Funding Confirmation','Westlake Pre-Qualification'] },
  { group:'CarStory',    domain:'carstory.com',    subjects:['CarStory Market Report Lead','CarStory Shopper Inquiry'] },
  { group:'Shift',       domain:'shift.com',       subjects:['Shift Trade Appraisal','Shift Purchase Request'] },
  { group:'Carvana',     domain:'carvana.com',     subjects:['Carvana Wholesale Offer','Carvana Trade Notification'] }
].forEach(function(v){
  v.subjects.forEach(function(s, i){
    var box = ['leads', 'noreply', 'alerts'][i % 3];
    VENDORS.push({ email: box + '@' + v.domain, subject: s, group: v.group });
  });
});

VENDORS = VENDORS.map(function(v, i){ return { id:i+1, email:v.email, subject:v.subject, group:v.group }; });

var CV_PAGE_SIZE = 10;
var cvPage = 1;

function cvEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cvFiltered(){
  var q = (document.getElementById('cv-search').value || '').toLowerCase().trim();
  if(!q) return VENDORS;
  return VENDORS.filter(function(v){
    return (v.email + ' ' + v.subject + ' ' + v.group).toLowerCase().indexOf(q) >= 0;
  });
}

function cvSearchChanged(){ cvPage = 1; cvRender(); }

function cvRender(){
  var rows = cvFiltered();
  var pages = Math.max(1, Math.ceil(rows.length / CV_PAGE_SIZE));
  if(cvPage > pages) cvPage = pages;
  var start = (cvPage - 1) * CV_PAGE_SIZE;
  var pageRows = rows.slice(start, start + CV_PAGE_SIZE);

  var tb = document.getElementById('cv-tbody');
  if(!pageRows.length){
    tb.innerHTML = '<tr><td colspan="5"><div class="cv-empty">No CRM vendors match your search.</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function(v, i){
      return '<tr>' +
        '<td>' + (start + i + 1) + '</td>' +
        '<td class="cv-email">' + cvEscape(v.email) + '</td>' +
        '<td class="cv-subject">' + cvEscape(v.subject) + '</td>' +
        '<td class="cv-group">' + cvEscape(v.group) + '</td>' +
        '<td style="text-align:center;">' +
          '<button class="cv-kebab" aria-label="Actions for ' + cvEscape(v.email) + '" onclick="cvOpenMenu(event,' + v.id + ')">' +
            '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  var from = rows.length ? start + 1 : 0;
  var to = Math.min(start + CV_PAGE_SIZE, rows.length);
  document.getElementById('cv-range').textContent = from + '–' + to + ' of ' + rows.length;
  cvRenderPager(pages);
}

// 1 2 3 4 5 … last, with the window sliding around the current page
function cvRenderPager(pages){
  var nums = [];
  if(pages <= 7){
    for(var p = 1; p <= pages; p++) nums.push(p);
  } else if(cvPage <= 5){
    nums = [1,2,3,4,5,'…',pages];
  } else if(cvPage >= pages - 4){
    nums = [1,'…',pages-4,pages-3,pages-2,pages-1,pages];
  } else {
    nums = [1,'…',cvPage-1,cvPage,cvPage+1,'…',pages];
  }

  var html = '<button class="pb" onclick="cvGo(' + (cvPage-1) + ')"' + (cvPage === 1 ? ' disabled' : '') + ' aria-label="Previous page">&#x2039;</button>';
  nums.forEach(function(n){
    html += n === '…'
      ? '<span class="pager-ell">…</span>'
      : '<button class="pb' + (n === cvPage ? ' on' : '') + '" onclick="cvGo(' + n + ')">' + n + '</button>';
  });
  html += '<button class="pb" onclick="cvGo(' + (cvPage+1) + ')"' + (cvPage === pages ? ' disabled' : '') + ' aria-label="Next page">&#x203A;</button>';
  document.getElementById('cv-pager').innerHTML = html;
}

function cvGo(p){
  var pages = Math.max(1, Math.ceil(cvFiltered().length / CV_PAGE_SIZE));
  cvPage = Math.min(Math.max(1, p), pages);
  cvRender();
  document.querySelector('.set-scroll').scrollTop = 0;
}

function cvFind(id){ return VENDORS.filter(function(v){ return v.id === id; })[0]; }

// -- Row actions menu --
var cvMenu = document.getElementById('cv-menu');
var cvMenuId = null;

function cvOpenMenu(e, id){
  e.stopPropagation();
  var wasOpen = cvMenu.classList.contains('open') && cvMenuId === id;
  cvCloseMenu();
  if(wasOpen) return;
  cvMenuId = id;
  cvMenu.classList.add('open');
  var r = e.currentTarget.getBoundingClientRect();
  var w = cvMenu.offsetWidth, h = cvMenu.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  cvMenu.style.left = left + 'px';
  cvMenu.style.top = top + 'px';
}
function cvCloseMenu(){ cvMenu.classList.remove('open'); cvMenuId = null; }
function cvMenuEdit(){ var id = cvMenuId; cvCloseMenu(); if(id !== null) cvOpenEdit(id); }
function cvMenuDelete(){ var id = cvMenuId; cvCloseMenu(); if(id !== null) cvDelete(id); }

cvMenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', cvCloseMenu);
window.addEventListener('resize', cvCloseMenu);
document.querySelector('.set-scroll').addEventListener('scroll', cvCloseMenu);

// -- Add / edit --
var cvModal = document.getElementById('cv-modal');
var cvEditId = null;

function cvOpenAdd(){
  cvEditId = null;
  document.getElementById('cv-modal-title').textContent = 'Add CRM Vendor';
  document.getElementById('cv-modal-save').textContent = 'Add vendor';
  document.getElementById('cv-email').value = '';
  document.getElementById('cv-subject').value = '';
  document.getElementById('cv-group').value = '';
  cvModal.classList.add('open');
}
function cvOpenEdit(id){
  var v = cvFind(id);
  if(!v) return;
  cvEditId = id;
  document.getElementById('cv-modal-title').textContent = 'Edit CRM Vendor';
  document.getElementById('cv-modal-save').textContent = 'Save changes';
  document.getElementById('cv-email').value = v.email;
  document.getElementById('cv-subject').value = v.subject;
  document.getElementById('cv-group').value = v.group;
  cvModal.classList.add('open');
}
function cvClose(){ cvModal.classList.remove('open'); cvEditId = null; }
function cvSave(){
  var emailEl = document.getElementById('cv-email');
  var email = emailEl.value.trim();
  if(!email){ emailEl.focus(); return; }
  var subject = document.getElementById('cv-subject').value.trim();
  var group = document.getElementById('cv-group').value.trim();

  if(cvEditId !== null){
    var v = cvFind(cvEditId);
    if(v){ v.email = email; v.subject = subject; v.group = group; }
    cvRender();
    cvClose();
    window.showNavToast('Vendor Updated', email + ' has been updated.');
    return;
  }
  var maxId = VENDORS.reduce(function(m, x){ return Math.max(m, x.id); }, 0);
  VENDORS.unshift({ id:maxId+1, email:email, subject:subject, group:group });
  cvPage = 1;
  cvRender();
  cvClose();
  window.showNavToast('Vendor Added', email + ' has been added.');
}
function cvDelete(id){
  var v = cvFind(id);
  if(!v) return;
  VENDORS = VENDORS.filter(function(x){ return x.id !== id; });
  cvRender();
  window.showNavToast('Vendor Deleted', v.email + ' has been deleted.');
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ cvCloseMenu(); cvClose(); }
});

cvRender();
</script>

</body>
</html>
