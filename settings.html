<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.set-section-label{font-size:10.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-family:var(--font);margin-bottom:12px;}
.set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:900px){.set-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.set-grid{grid-template-columns:1fr;}}
.set-card{display:flex;align-items:center;gap:12px;padding:16px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;cursor:pointer;transition:border-color .15s;position:relative;}
.set-card:hover{border-color:var(--ac);}
.set-card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(79,124,255,.1);color:var(--ac);}
.set-card-icon svg{width:17px;height:17px;}
.set-card-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.set-card-title{font-size:13px;font-weight:600;color:var(--tx);font-family:var(--font);}
.set-card-desc{font-size:11px;color:var(--mu);font-family:var(--font);}
.set-card-info-btn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mu);opacity:.5;transition:opacity .15s;margin-left:auto;}
.set-card:hover .set-card-info-btn{opacity:.8;}
.set-card-info-btn svg{width:14px;height:14px;}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <span class="set-page-title"></span>
  </div>
  <div class="set-scroll">

    <div class="set-section-label">Company Setting</div>
    <div class="set-grid">

      <div class="set-card" onclick="location.href='role-management.html'">
        <div class="set-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="set-card-info">
          <div class="set-card-title">Role Management</div>
          <div class="set-card-desc">Manage User Roles</div>
        </div>
        <span class="set-card-info-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
      </div>

      <div class="set-card" onclick="location.href='user-management.html'">
        <div class="set-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="set-card-info">
          <div class="set-card-title">User Management</div>
          <div class="set-card-desc">Manage users and their info</div>
        </div>
        <span class="set-card-info-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
      </div>

      <div class="set-card" onclick="location.href='userroles.html'">
        <div class="set-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="set-card-info">
          <div class="set-card-title">User Roles</div>
          <div class="set-card-desc">Configure role permissions</div>
        </div>
        <span class="set-card-info-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
      </div>

    </div>

  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'Settings' });</script>

</body>
</html>
