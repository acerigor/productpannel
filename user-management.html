<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.um-user{display:flex;align-items:center;gap:10px;}
.um-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;}
.um-name{font-size:13px;font-weight:500;color:var(--tx);font-family:var(--font);}
.um-role{display:inline-flex;align-items:center;padding:3px 9px;font-size:11px;font-weight:500;border-radius:5px;font-family:var(--font);}
.um-role--admin{background:rgba(79,124,255,.12);color:var(--ac);}
.um-role--agent{background:rgba(52,199,89,.12);color:#34c759;}
.um-role--user{background:rgba(255,159,10,.12);color:#ff9f0a;}
.modal-field select{width:100%;height:100%;background:none;border:none;color:var(--tx);font-family:var(--font);font-size:13px;outline:none;cursor:pointer;}
.modal-field select option{background:var(--sur2);color:var(--tx);}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
    <button class="tbtn tbtn-p" onclick="umOpenAdd()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Add User</span>
    </button>
  </div>
  <div class="set-scroll">
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th style="width:100px;text-align:center;">Role</th>
              <th style="width:90px;text-align:center;">Status</th>
            </tr>
          </thead>
          <tbody id="um-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop modal-fullscreen-mobile" id="um-modal" onclick="if(event.target===this)umClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="um-modal-title">Edit User</div>
      <button class="modal-close" onclick="umClose()">&#x2715;</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label class="modal-field-label">Name</label>
        <div class="modal-field"><input id="um-name" placeholder="Full name"/></div>
      </div>
      <div>
        <label class="modal-field-label">Email</label>
        <div class="modal-field"><input id="um-email" placeholder="Email address" type="email"/></div>
      </div>
      <div>
        <label class="modal-field-label">Phone</label>
        <div class="modal-field"><input id="um-phone" placeholder="Phone number"/></div>
      </div>
      <div>
        <label class="modal-field-label" id="um-pw-label">Password</label>
        <div class="modal-field"><input id="um-password" placeholder="Password" type="password"/></div>
      </div>
      <div>
        <label class="modal-field-label">Confirm Password</label>
        <div class="modal-field"><input id="um-confirm" placeholder="Confirm password" type="password"/></div>
      </div>
      <div>
        <label class="modal-field-label">Role</label>
        <div class="modal-field">
          <select id="um-role">
            <option value="Admin">Admin</option>
            <option value="Agent">Agent</option>
            <option value="User">User</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="ls-delete" id="um-delete" onclick="umDelete()">Delete</button>
      <div style="flex:1"></div>
      <button class="modal-cancel" onclick="umClose()">Cancel</button>
      <button class="modal-save" onclick="umSave()">Save</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'User Management' });</script>
<script>
var UM_COLORS = ['#4f7cff','#34c759','#ff9f0a','#af52de','#ff375f','#30b0c7','#ff6723'];
var USERS = [
  { id:1, name:'Brian Smith',    phone:'(602) 555-0101', email:'brian@corepanel.com',  role:'Admin', pw:'admin123', active:true },
  { id:2, name:'Sarah Johnson',  phone:'(480) 555-0202', email:'sarah@corepanel.com',  role:'Agent', pw:'agent123', active:true },
  { id:3, name:'Mike Davis',     phone:'(623) 555-0303', email:'mike@corepanel.com',   role:'User',  pw:'user123',  active:true }
];
function umInitials(name){
  var p = name.trim().split(/\s+/);
  return p.length > 1 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : name.substring(0,2).toUpperCase();
}
function umColor(id){ return UM_COLORS[(id-1) % UM_COLORS.length]; }
function umRoleCls(role){ return 'um-role um-role--' + role.toLowerCase(); }
function umEsc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function umRender(){
  var tb = document.getElementById('um-tbody');
  tb.innerHTML = USERS.map(function(u){
    return '<tr style="cursor:pointer" onclick="umEdit(' + u.id + ')">' +
      '<td><div class="um-user"><div class="um-avatar" style="background:' + umColor(u.id) + '">' + umInitials(u.name) + '</div><span class="um-name">' + umEsc(u.name) + '</span></div></td>' +
      '<td>' + umEsc(u.phone) + '</td>' +
      '<td>' + umEsc(u.email) + '</td>' +
      '<td style="text-align:center;"><span class="' + umRoleCls(u.role) + '">' + umEsc(u.role) + '</span></td>' +
      '<td style="text-align:center;">' +
        '<span class="us-yn-tog' + (u.active ? '' : ' off') + '" onclick="event.stopPropagation();umToggle(this,' + u.id + ')">' +
          '<span class="us-yn-tog-txt"></span><span class="us-yn-tog-knob"></span>' +
        '</span>' +
      '</td>' +
    '</tr>';
  }).join('');
}
function umToggle(el, id){
  el.classList.toggle('off');
  var u = USERS.find(function(x){ return x.id === id; });
  if(u) u.active = !el.classList.contains('off');
  var on = !el.classList.contains('off');
  window.showNavToast(u.name, u.name + (on ? ' enabled.' : ' disabled.'));
}
var umEditId = null;
function umEdit(id){
  var u = USERS.find(function(x){ return x.id === id; });
  if(!u) return;
  umEditId = id;
  document.getElementById('um-modal-title').textContent = 'Edit User';
  document.getElementById('um-name').value = u.name;
  document.getElementById('um-email').value = u.email;
  document.getElementById('um-phone').value = u.phone;
  document.getElementById('um-password').value = '';
  document.getElementById('um-password').placeholder = 'Leave blank to keep current';
  document.getElementById('um-confirm').value = '';
  document.getElementById('um-role').value = u.role;
  document.getElementById('um-delete').style.display = '';
  document.getElementById('um-modal').classList.add('open');
}
function umOpenAdd(){
  umEditId = null;
  document.getElementById('um-modal-title').textContent = 'Add User';
  document.getElementById('um-name').value = '';
  document.getElementById('um-email').value = '';
  document.getElementById('um-phone').value = '';
  document.getElementById('um-password').value = '';
  document.getElementById('um-password').placeholder = 'Password';
  document.getElementById('um-confirm').value = '';
  document.getElementById('um-role').value = 'User';
  document.getElementById('um-delete').style.display = 'none';
  document.getElementById('um-modal').classList.add('open');
}
function umClose(){
  document.getElementById('um-modal').classList.remove('open');
}
function umSave(){
  var name = document.getElementById('um-name').value.trim();
  var email = document.getElementById('um-email').value.trim();
  var phone = document.getElementById('um-phone').value.trim();
  var pw = document.getElementById('um-password').value;
  var confirm = document.getElementById('um-confirm').value;
  var role = document.getElementById('um-role').value;
  if(!name){ document.getElementById('um-name').focus(); return; }
  if(!email){ document.getElementById('um-email').focus(); return; }
  if(umEditId === null && !pw){ document.getElementById('um-password').focus(); return; }
  if(pw && pw !== confirm){ window.showNavToast('Error','Passwords do not match.'); document.getElementById('um-confirm').focus(); return; }
  if(umEditId !== null){
    var u = USERS.find(function(x){ return x.id === umEditId; });
    if(u){ u.name = name; u.email = email; u.phone = phone; u.role = role; if(pw) u.pw = pw; }
    window.showNavToast('User Updated', name + ' has been updated.');
  } else {
    var maxId = USERS.reduce(function(m,u){ return Math.max(m,u.id); }, 0);
    USERS.push({ id: maxId+1, name: name, email: email, phone: phone, role: role, pw: pw });
    window.showNavToast('User Added', name + ' has been added.');
  }
  umRender();
  umClose();
}
function umDelete(){
  var u = USERS.find(function(x){ return x.id === umEditId; });
  if(!u) return;
  USERS = USERS.filter(function(x){ return x.id !== umEditId; });
  window.showNavToast('User Deleted', u.name + ' has been deleted.');
  umRender();
  umClose();
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') umClose(); });
umRender();
</script>

</body>
</html>
