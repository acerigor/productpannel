<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Location — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.set-scroll .table-wrap{margin:0;}

.pl-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.pl-search{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;max-width:420px;height:42px;
  padding:0 13px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;transition:border-color .15s;}
.pl-search:focus-within{border-color:var(--ac);}
.pl-search svg{width:15px;height:15px;color:var(--mu);flex-shrink:0;}
.pl-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--font);font-size:13px;}
.pl-search input::placeholder{color:var(--mu);}
.pl-add{display:flex;align-items:center;gap:7px;margin-left:auto;height:42px;padding:0 18px;background:var(--ac);
  border:none;border-radius:10px;color:#fff;font:600 13px/1 var(--font);cursor:pointer;transition:background .15s;white-space:nowrap;}
.pl-add:hover{background:var(--ac2);}
.pl-add svg{width:14px;height:14px;}

.pl-name{color:var(--tx);}
.pl-area{color:var(--tx);font-family:var(--mono);font-size:12.5px;}
.pl-kebab{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:transparent;border:none;border-radius:7px;color:var(--mu);cursor:pointer;transition:background .12s,color .12s;}
.pl-kebab:hover{background:var(--hover);color:var(--tx);}
.pl-kebab svg{width:15px;height:15px;}
.pl-menu{display:none;position:fixed;z-index:200;min-width:150px;background:var(--sur);
  border:0.5px solid var(--brd2);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;}
.pl-menu.open{display:block;}
.pl-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:0 13px;min-height:38px;
  background:none;border:none;border-bottom:0.5px solid var(--brd);color:var(--tx);
  font:500 12.5px/1 var(--font);cursor:pointer;text-align:left;}
.pl-menu-item:last-child{border-bottom:none;}
.pl-menu-item:hover{background:var(--hover);color:var(--ac2);}
.pl-menu-item.danger:hover{color:var(--rd);}
.pl-menu-item svg{width:14px;height:14px;color:var(--mu);flex-shrink:0;}
.pl-menu-item:hover svg{color:inherit;}
.pl-empty{padding:34px 12px;text-align:center;color:var(--mu);font-size:12.5px;}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
  </div>

  <div class="set-scroll">

    <div class="pl-bar">
      <label class="pl-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input id="pl-search" placeholder="Search phone locations..." oninput="plRender()"/>
      </label>
      <button class="pl-add" onclick="plOpenAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Phone Location
      </button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:80px;">No.</th>
              <th>Location Name</th>
              <th style="width:260px;">Area Code</th>
              <th style="width:100px;text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="pl-tbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Row actions menu -->
<div class="pl-menu" id="pl-menu">
  <button class="pl-menu-item" onclick="plMenuEdit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Edit
  </button>
  <button class="pl-menu-item danger" onclick="plMenuDelete()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    Delete
  </button>
</div>

<!-- Add / edit location -->
<div class="modal-backdrop modal-fullscreen-mobile" id="pl-modal" onclick="if(event.target===this) plClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="pl-modal-title">Add Phone Location</div>
      <button class="modal-close" onclick="plClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div>
        <label class="modal-field-label" for="pl-f-name">Location Name</label>
        <div class="modal-field"><input id="pl-f-name" placeholder="e.g. TX"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="pl-f-area">Area Code</label>
        <div class="modal-field"><input id="pl-f-area" placeholder="e.g. 832" inputmode="numeric"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="plClose()">Cancel</button>
      <button class="modal-save" id="pl-modal-save" onclick="plSave()">Add location</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'Phone Location' });</script>
<script>
var LOCATIONS = [
  { id:1, name:'TX', area:'832' },
  { id:2, name:'FL', area:'850' }
];

function plEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function plRender(){
  var q = (document.getElementById('pl-search').value || '').toLowerCase().trim();
  var rows = LOCATIONS.filter(function(l){
    return !q || (l.name + ' ' + l.area).toLowerCase().indexOf(q) >= 0;
  });
  var tb = document.getElementById('pl-tbody');
  if(!rows.length){
    tb.innerHTML = '<tr><td colspan="4"><div class="pl-empty">' +
      (q ? 'No phone locations match your search.' : 'No phone locations yet.') + '</div></td></tr>';
    return;
  }
  tb.innerHTML = rows.map(function(l, i){
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td class="pl-name">' + plEscape(l.name) + '</td>' +
      '<td class="pl-area">' + plEscape(l.area) + '</td>' +
      '<td style="text-align:center;">' +
        '<button class="pl-kebab" onclick="plOpenMenu(event,' + l.id + ')" aria-label="Actions for ' + plEscape(l.name) + '">' +
          '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>' +
        '</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function plFind(id){ return LOCATIONS.filter(function(l){ return l.id === id; })[0]; }

// -- Row actions menu --
var plMenu = document.getElementById('pl-menu');
var plMenuId = null;

function plOpenMenu(e, id){
  e.stopPropagation();
  var wasOpen = plMenu.classList.contains('open') && plMenuId === id;
  plCloseMenu();
  if(wasOpen) return;
  plMenuId = id;
  plMenu.classList.add('open');
  var r = e.currentTarget.getBoundingClientRect();
  var w = plMenu.offsetWidth, h = plMenu.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  plMenu.style.left = left + 'px';
  plMenu.style.top = top + 'px';
}
function plCloseMenu(){ plMenu.classList.remove('open'); plMenuId = null; }
function plMenuEdit(){ var id = plMenuId; plCloseMenu(); if(id !== null) plOpenEdit(id); }
function plMenuDelete(){
  var l = plFind(plMenuId);
  plCloseMenu();
  if(!l) return;
  LOCATIONS = LOCATIONS.filter(function(x){ return x.id !== l.id; });
  plRender();
  window.showNavToast('Location Deleted', l.name + ' has been deleted.');
}

plMenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', plCloseMenu);
window.addEventListener('resize', plCloseMenu);
document.querySelector('.set-scroll').addEventListener('scroll', plCloseMenu);

// -- Add / edit --
var plModal = document.getElementById('pl-modal');
var plEditId = null;

function plOpenAdd(){
  plEditId = null;
  document.getElementById('pl-modal-title').textContent = 'Add Phone Location';
  document.getElementById('pl-modal-save').textContent = 'Add location';
  document.getElementById('pl-f-name').value = '';
  document.getElementById('pl-f-area').value = '';
  plModal.classList.add('open');
}
function plOpenEdit(id){
  var l = plFind(id);
  if(!l) return;
  plEditId = id;
  document.getElementById('pl-modal-title').textContent = 'Edit Phone Location';
  document.getElementById('pl-modal-save').textContent = 'Save changes';
  document.getElementById('pl-f-name').value = l.name;
  document.getElementById('pl-f-area').value = l.area;
  plModal.classList.add('open');
}
function plClose(){ plModal.classList.remove('open'); plEditId = null; }
function plSave(){
  var nameEl = document.getElementById('pl-f-name');
  var areaEl = document.getElementById('pl-f-area');
  var name = nameEl.value.trim();
  var area = areaEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  if(!area){ areaEl.focus(); return; }
  if(plEditId !== null){
    var l = plFind(plEditId);
    if(l){ l.name = name; l.area = area; }
    plRender();
    plClose();
    window.showNavToast('Location Updated', name + ' has been updated.');
    return;
  }
  var maxId = LOCATIONS.reduce(function(m, x){ return Math.max(m, x.id); }, 0);
  LOCATIONS.push({ id:maxId+1, name:name, area:area });
  plRender();
  plClose();
  window.showNavToast('Location Added', name + ' has been added.');
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ plCloseMenu(); plClose(); }
});

plRender();
</script>

</body>
</html>
