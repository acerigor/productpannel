<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.set-scroll .table-wrap{margin:0;}
.set-scroll .tfooter{margin:0;padding-top:14px;}

.cj-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.cj-search{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;max-width:420px;height:42px;
  padding:0 13px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;transition:border-color .15s;}
.cj-search:focus-within{border-color:var(--ac);}
.cj-search svg{width:15px;height:15px;color:var(--mu);flex-shrink:0;}
.cj-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--font);font-size:13px;}
.cj-search input::placeholder{color:var(--mu);}
.cj-add{display:flex;align-items:center;gap:7px;margin-left:auto;height:42px;padding:0 18px;background:var(--ac);
  border:none;border-radius:10px;color:#fff;font:600 13px/1 var(--font);cursor:pointer;transition:background .15s;white-space:nowrap;}
.cj-add:hover{background:var(--ac2);}
.cj-add svg{width:14px;height:14px;}

.cj-name{color:var(--tx);}
.cj-link{color:var(--ac2);font-family:var(--mono);font-size:12px;}
.cj-exec{color:var(--tx2);}
.cj-time{color:var(--tx);font-family:var(--mono);font-size:12.5px;}
.cj-type{color:var(--mu);}
.cj-status{display:inline-flex;align-items:center;justify-content:center;padding:0 14px;height:26px;border-radius:6px;
  background:var(--gr);color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;}
.cj-status.running{background:var(--am);}
.cj-status.failed{background:var(--rd);}
.cj-kebab{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:transparent;border:none;border-radius:7px;color:var(--mu);cursor:pointer;transition:background .12s,color .12s;}
.cj-kebab:hover{background:var(--hover);color:var(--tx);}
.cj-kebab svg{width:15px;height:15px;}
.cj-menu{display:none;position:fixed;z-index:200;min-width:150px;background:var(--sur);
  border:0.5px solid var(--brd2);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;}
.cj-menu.open{display:block;}
.cj-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:0 13px;min-height:38px;
  background:none;border:none;border-bottom:0.5px solid var(--brd);color:var(--tx);
  font:500 12.5px/1 var(--font);cursor:pointer;text-align:left;}
.cj-menu-item:last-child{border-bottom:none;}
.cj-menu-item:hover{background:var(--hover);color:var(--ac2);}
.cj-menu-item.danger:hover{color:var(--rd);}
.cj-menu-item svg{width:14px;height:14px;color:var(--mu);flex-shrink:0;}
.cj-menu-item:hover svg{color:inherit;}
.cj-empty{padding:34px 12px;text-align:center;color:var(--mu);font-size:12.5px;}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
  </div>

  <div class="set-scroll">

    <div class="cj-bar">
      <label class="cj-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input id="cj-search" placeholder="Search cron jobs..." oninput="cjSearchChanged()"/>
      </label>
      <button class="cj-add" onclick="cjOpenAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Cron
      </button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:70px;">No.</th>
              <th style="width:250px;">Cron</th>
              <th style="width:290px;">Link</th>
              <th style="width:150px;">Executing</th>
              <th style="width:170px;">Hour / Minute / Time</th>
              <th style="width:130px;">Type</th>
              <th style="width:140px;">Status</th>
              <th style="width:90px;text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="cj-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="tfooter">
      <span id="cj-range">0–0 of 0</span>
      <div class="pgn" id="cj-pager"></div>
    </div>

  </div>
</div>

<!-- Row actions menu -->
<div class="cj-menu" id="cj-menu">
  <button class="cj-menu-item" onclick="cjMenuRun()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    Run now
  </button>
  <button class="cj-menu-item" onclick="cjMenuEdit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Edit
  </button>
  <button class="cj-menu-item danger" onclick="cjMenuDelete()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    Delete
  </button>
</div>

<!-- Add / edit cron -->
<div class="modal-backdrop modal-fullscreen-mobile" id="cj-modal" onclick="if(event.target===this) cjClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="cj-modal-title">Add Cron</div>
      <button class="modal-close" onclick="cjClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div>
        <label class="modal-field-label" for="cj-name">Cron</label>
        <div class="modal-field"><input id="cj-name" placeholder="e.g. Get CRM Lead From Mail"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="cj-link">Link</label>
        <div class="modal-field"><input id="cj-link" placeholder="../scripts/yourscript"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="cj-exec">Executing</label>
        <div class="modal-field">
          <select id="cj-exec">
            <option>Every minute</option>
            <option>Every hour</option>
            <option>Daily</option>
            <option>Weekly</option>
          </select>
        </div>
      </div>
      <div>
        <label class="modal-field-label" for="cj-time">Hour / Minute / Time</label>
        <div class="modal-field"><input id="cj-time" placeholder="e.g. 5 Minute or 20:00"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="cj-type">Type</label>
        <div class="modal-field">
          <select id="cj-type">
            <option>Automatic</option>
            <option>Manual</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="cjClose()">Cancel</button>
      <button class="modal-save" id="cj-modal-save" onclick="cjSave()">Add cron</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'Cron' });</script>
<script>
var CRONS = [
  { name:'Get CRM Lead From Mail',        link:'../scripts/scrapecrmleads',            exec:'Every minute', time:'5 Minute' },
  { name:'Update Lead Type',              link:'../scripts/updatecrmleadstype',        exec:'Every hour',   time:'4 Hour' },
  { name:'Get Email Notifications',       link:'../scripts/getEmailNotification',      exec:'Every minute', time:'5 Minute' },
  { name:'Get Sold inventory data',       link:'../scripts/getInventory',              exec:'Daily',        time:'20:00' },
  { name:'Download Inventory Files',      link:'../scripts/downloadInventoryFiles',    exec:'Every hour',   time:'2 Hour' },
  { name:'Auto Lead Assignment',          link:'../scripts/automaticleadassignment',   exec:'Every minute', time:'10 Minute' },
  { name:'Update Call Contact Name',      link:'../scripts/getcallscustomername',      exec:'Every hour',   time:'1 Hour' },
  { name:'Update VoiceMail Contact Name', link:'../scripts/getvoicemailscustomername', exec:'Every hour',   time:'1 Hour' },
  { name:'Update Team Call Contact Name', link:'../scripts/getteamcallscustomername',  exec:'Every hour',   time:'1 Hour' },
  { name:'Send Customer Schedule Message',link:'../scripts/customerschedulemessagesend',exec:'Every minute',time:'1 Minute' },
  { name:'Sync Auction Run Lists',        link:'../scripts/syncauctionrunlists',       exec:'Daily',        time:'04:00' },
  { name:'Refresh Market Pricing',        link:'../scripts/refreshmarketpricing',      exec:'Every hour',   time:'6 Hour' },
  { name:'Expire Stale Leads',            link:'../scripts/expirestaleleads',          exec:'Daily',        time:'01:00' },
  { name:'Send Appointment Reminders',    link:'../scripts/sendappointmentreminders',  exec:'Every minute', time:'15 Minute' },
  { name:'Rebuild Search Index',          link:'../scripts/rebuildsearchindex',        exec:'Daily',        time:'02:30' },
  { name:'Process Trade Appraisals',      link:'../scripts/processtradeappraisals',    exec:'Every hour',   time:'3 Hour' },
  { name:'Archive Old Notifications',     link:'../scripts/archivenotifications',      exec:'Weekly',       time:'Sun 03:00' },
  { name:'Sync Twilio Call Logs',         link:'../scripts/synctwiliocalllogs',        exec:'Every minute', time:'5 Minute' },
  { name:'Update Vehicle Photos',         link:'../scripts/updatevehiclephotos',       exec:'Every hour',   time:'2 Hour' },
  { name:'Recalculate Vehicle Score',     link:'../scripts/recalculatevehiclescore',   exec:'Daily',        time:'05:30' },
  { name:'Send SMS Queue',                link:'../scripts/sendsmsqueue',              exec:'Every minute', time:'1 Minute' },
  { name:'Generate Daily Reports',        link:'../scripts/generatedailyreports',      exec:'Daily',        time:'06:00' },
  { name:'Clean Temp Files',              link:'../scripts/cleantempfiles',            exec:'Weekly',       time:'Sat 23:00' },
  { name:'Check Auction Credentials',     link:'../scripts/checkauctioncredentials',   exec:'Daily',        time:'07:15' }
].map(function(c, i){
  return { id:i+1, name:c.name, link:c.link, exec:c.exec, time:c.time, type:'Automatic', status:'Complete' };
});

var CJ_PAGE_SIZE = 10;
var cjPage = 1;

function cjEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cjFiltered(){
  var q = (document.getElementById('cj-search').value || '').toLowerCase().trim();
  if(!q) return CRONS;
  return CRONS.filter(function(c){
    return (c.name + ' ' + c.link + ' ' + c.exec + ' ' + c.time + ' ' + c.type).toLowerCase().indexOf(q) >= 0;
  });
}

function cjSearchChanged(){ cjPage = 1; cjRender(); }

function cjRender(){
  var rows = cjFiltered();
  var pages = Math.max(1, Math.ceil(rows.length / CJ_PAGE_SIZE));
  if(cjPage > pages) cjPage = pages;
  var start = (cjPage - 1) * CJ_PAGE_SIZE;
  var pageRows = rows.slice(start, start + CJ_PAGE_SIZE);

  var tb = document.getElementById('cj-tbody');
  if(!pageRows.length){
    tb.innerHTML = '<tr><td colspan="8"><div class="cj-empty">No cron jobs match your search.</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function(c, i){
      var statusCls = c.status === 'Running' ? ' running' : (c.status === 'Failed' ? ' failed' : '');
      return '<tr>' +
        '<td>' + (start + i + 1) + '</td>' +
        '<td class="cj-name">' + cjEscape(c.name) + '</td>' +
        '<td class="cj-link">' + cjEscape(c.link) + '</td>' +
        '<td class="cj-exec">' + cjEscape(c.exec) + '</td>' +
        '<td class="cj-time">' + cjEscape(c.time) + '</td>' +
        '<td class="cj-type">' + cjEscape(c.type) + '</td>' +
        '<td><span class="cj-status' + statusCls + '">' + cjEscape(c.status) + '</span></td>' +
        '<td style="text-align:center;">' +
          '<button class="cj-kebab" onclick="cjOpenMenu(event,' + c.id + ')" aria-label="Actions for ' + cjEscape(c.name) + '">' +
            '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  var from = rows.length ? start + 1 : 0;
  var to = Math.min(start + CJ_PAGE_SIZE, rows.length);
  document.getElementById('cj-range').textContent = from + '–' + to + ' of ' + rows.length;
  cjRenderPager(pages);
}

function cjRenderPager(pages){
  var nums = [];
  if(pages <= 7){
    for(var p = 1; p <= pages; p++) nums.push(p);
  } else if(cjPage <= 5){
    nums = [1,2,3,4,5,'…',pages];
  } else if(cjPage >= pages - 4){
    nums = [1,'…',pages-4,pages-3,pages-2,pages-1,pages];
  } else {
    nums = [1,'…',cjPage-1,cjPage,cjPage+1,'…',pages];
  }
  var html = '<button class="pb" onclick="cjGo(' + (cjPage-1) + ')"' + (cjPage === 1 ? ' disabled' : '') + ' aria-label="Previous page">&#x2039;</button>';
  nums.forEach(function(n){
    html += n === '…'
      ? '<span class="pager-ell">…</span>'
      : '<button class="pb' + (n === cjPage ? ' on' : '') + '" onclick="cjGo(' + n + ')">' + n + '</button>';
  });
  html += '<button class="pb" onclick="cjGo(' + (cjPage+1) + ')"' + (cjPage === pages ? ' disabled' : '') + ' aria-label="Next page">&#x203A;</button>';
  document.getElementById('cj-pager').innerHTML = html;
}

function cjGo(p){
  var pages = Math.max(1, Math.ceil(cjFiltered().length / CJ_PAGE_SIZE));
  cjPage = Math.min(Math.max(1, p), pages);
  cjRender();
  document.querySelector('.set-scroll').scrollTop = 0;
}

function cjFind(id){ return CRONS.filter(function(c){ return c.id === id; })[0]; }

// -- Row actions menu --
var cjMenu = document.getElementById('cj-menu');
var cjMenuId = null;

function cjOpenMenu(e, id){
  e.stopPropagation();
  var wasOpen = cjMenu.classList.contains('open') && cjMenuId === id;
  cjCloseMenu();
  if(wasOpen) return;
  cjMenuId = id;
  cjMenu.classList.add('open');
  var r = e.currentTarget.getBoundingClientRect();
  var w = cjMenu.offsetWidth, h = cjMenu.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  cjMenu.style.left = left + 'px';
  cjMenu.style.top = top + 'px';
}
function cjCloseMenu(){ cjMenu.classList.remove('open'); cjMenuId = null; }

function cjMenuRun(){
  var c = cjFind(cjMenuId);
  cjCloseMenu();
  if(!c) return;
  var prev = c.status;
  c.status = 'Running';
  cjRender();
  window.showNavToast(c.name, 'Running ' + c.name + '…');
  setTimeout(function(){
    c.status = prev === 'Failed' ? 'Complete' : prev;
    cjRender();
  }, 1800);
}
function cjMenuEdit(){ var id = cjMenuId; cjCloseMenu(); if(id !== null) cjOpenEdit(id); }
function cjMenuDelete(){
  var c = cjFind(cjMenuId);
  cjCloseMenu();
  if(!c) return;
  CRONS = CRONS.filter(function(x){ return x.id !== c.id; });
  cjRender();
  window.showNavToast('Cron Deleted', c.name + ' has been deleted.');
}

cjMenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', cjCloseMenu);
window.addEventListener('resize', cjCloseMenu);
document.querySelector('.set-scroll').addEventListener('scroll', cjCloseMenu);

// -- Add / edit --
var cjModal = document.getElementById('cj-modal');
var cjEditId = null;

function cjOpenAdd(){
  cjEditId = null;
  document.getElementById('cj-modal-title').textContent = 'Add Cron';
  document.getElementById('cj-modal-save').textContent = 'Add cron';
  document.getElementById('cj-name').value = '';
  document.getElementById('cj-link').value = '';
  document.getElementById('cj-exec').selectedIndex = 0;
  document.getElementById('cj-time').value = '';
  document.getElementById('cj-type').selectedIndex = 0;
  cjModal.classList.add('open');
}
function cjOpenEdit(id){
  var c = cjFind(id);
  if(!c) return;
  cjEditId = id;
  document.getElementById('cj-modal-title').textContent = 'Edit Cron';
  document.getElementById('cj-modal-save').textContent = 'Save changes';
  document.getElementById('cj-name').value = c.name;
  document.getElementById('cj-link').value = c.link;
  document.getElementById('cj-exec').value = c.exec;
  document.getElementById('cj-time').value = c.time;
  document.getElementById('cj-type').value = c.type;
  cjModal.classList.add('open');
}
function cjClose(){ cjModal.classList.remove('open'); cjEditId = null; }
function cjSave(){
  var nameEl = document.getElementById('cj-name');
  var name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  var data = {
    name: name,
    link: document.getElementById('cj-link').value.trim(),
    exec: document.getElementById('cj-exec').value,
    time: document.getElementById('cj-time').value.trim(),
    type: document.getElementById('cj-type').value
  };
  if(cjEditId !== null){
    var c = cjFind(cjEditId);
    if(c){ Object.keys(data).forEach(function(k){ c[k] = data[k]; }); }
    cjRender();
    cjClose();
    window.showNavToast('Cron Updated', name + ' has been updated.');
    return;
  }
  var maxId = CRONS.reduce(function(m, x){ return Math.max(m, x.id); }, 0);
  data.id = maxId + 1;
  data.status = 'Complete';
  CRONS.push(data);
  cjRender();
  cjClose();
  window.showNavToast('Cron Added', name + ' has been added.');
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ cjCloseMenu(); cjClose(); }
});

cjRender();
</script>

</body>
</html>
