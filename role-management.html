<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role Management — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
    <button class="tbtn tbtn-p" onclick="rmOpenAdd()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Add Role</span>
    </button>
  </div>
  <div class="set-scroll">
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:50px;text-align:center;">#</th>
              <th>Role Name</th>
              <th>Description</th>
              <th style="width:90px;text-align:center;">Status</th>
            </tr>
          </thead>
          <tbody id="rm-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop modal-fullscreen-mobile" id="rm-modal" onclick="if(event.target===this)rmCloseEdit()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="rm-modal-title">Edit Role</div>
      <button class="modal-close" onclick="rmCloseEdit()">&#x2715;</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label class="modal-field-label">Role Name</label>
        <div class="modal-field"><input id="rm-edit-name" placeholder="Role name"/></div>
      </div>
      <div>
        <label class="modal-field-label">Description</label>
        <div class="modal-field"><input id="rm-edit-desc" placeholder="Role description"/></div>
      </div>
      <div>
        <label class="modal-field-label">Status</label>
        <span class="us-yn-tog" id="rm-edit-tog" onclick="this.classList.toggle('off')">
          <span class="us-yn-tog-txt"></span><span class="us-yn-tog-knob"></span>
        </span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="ls-delete" id="rm-edit-delete" onclick="rmDeleteRole()">Delete</button>
      <div style="flex:1"></div>
      <button class="modal-cancel" onclick="rmCloseEdit()">Cancel</button>
      <button class="modal-save" onclick="rmSaveEdit()">Save</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'Role Management' });</script>
<script>
var ROLES = [
  { id:1, name:'Admin',  desc:'Full access to all features and settings', active:true },
  { id:2, name:'Agent',  desc:'Can manage inventory and handle deals',    active:true },
  { id:3, name:'User',   desc:'View-only access with limited actions',    active:true }
];
function rmRender(){
  var tb = document.getElementById('rm-tbody');
  tb.innerHTML = ROLES.map(function(r, i){
    var togCls = 'us-yn-tog' + (r.active ? '' : ' off');
    return '<tr style="cursor:pointer" onclick="rmEdit(' + r.id + ')">' +
      '<td style="text-align:center;">' + (i+1) + '</td>' +
      '<td>' + r.name + '</td>' +
      '<td>' + r.desc + '</td>' +
      '<td style="text-align:center;">' +
        '<span class="' + togCls + '" onclick="event.stopPropagation();rmToggle(this,' + r.id + ')">' +
          '<span class="us-yn-tog-txt"></span><span class="us-yn-tog-knob"></span>' +
        '</span>' +
      '</td></tr>';
  }).join('');
}
function rmToggle(el, id){
  el.classList.toggle('off');
  var role = ROLES.find(function(r){ return r.id === id; });
  if(role) role.active = !el.classList.contains('off');
  var on = !el.classList.contains('off');
  window.showNavToast(role.name, role.name + (on ? ' enabled.' : ' disabled.'));
}
var rmEditId = null;
function rmOpenEdit(id){
  var role = ROLES.find(function(r){ return r.id === id; });
  if(!role) return;
  rmEditId = id;
  document.getElementById('rm-modal-title').textContent = 'Edit Role';
  document.getElementById('rm-edit-name').value = role.name;
  document.getElementById('rm-edit-desc').value = role.desc;
  var tog = document.getElementById('rm-edit-tog');
  tog.classList.toggle('off', !role.active);
  document.getElementById('rm-edit-delete').style.display = '';
  document.getElementById('rm-modal').classList.add('open');
}
function rmOpenAdd(){
  rmEditId = null;
  document.getElementById('rm-modal-title').textContent = 'Add Role';
  document.getElementById('rm-edit-name').value = '';
  document.getElementById('rm-edit-desc').value = '';
  document.getElementById('rm-edit-tog').classList.remove('off');
  document.getElementById('rm-edit-delete').style.display = 'none';
  document.getElementById('rm-modal').classList.add('open');
}
function rmCloseEdit(){
  document.getElementById('rm-modal').classList.remove('open');
}
function rmSaveEdit(){
  var name = document.getElementById('rm-edit-name').value.trim();
  var desc = document.getElementById('rm-edit-desc').value.trim();
  var active = !document.getElementById('rm-edit-tog').classList.contains('off');
  if(!name){ document.getElementById('rm-edit-name').focus(); return; }
  if(rmEditId !== null){
    var role = ROLES.find(function(r){ return r.id === rmEditId; });
    if(role){ role.name = name; role.desc = desc; role.active = active; }
    window.showNavToast('Role Updated', name + ' has been updated.');
  } else {
    var maxId = ROLES.reduce(function(m,r){ return Math.max(m,r.id); }, 0);
    ROLES.push({ id: maxId+1, name: name, desc: desc, active: active });
    window.showNavToast('Role Added', name + ' has been added.');
  }
  rmRender();
  rmCloseEdit();
}
function rmDeleteRole(){
  var role = ROLES.find(function(r){ return r.id === rmEditId; });
  if(!role) return;
  ROLES = ROLES.filter(function(r){ return r.id !== rmEditId; });
  window.showNavToast('Role Deleted', role.name + ' has been deleted.');
  rmRender();
  rmCloseEdit();
}
function rmEdit(id){ rmOpenEdit(id); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') rmCloseEdit(); });
rmRender();
</script>

</body>
</html>
