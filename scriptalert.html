<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Alert — BuySmart</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.sa-body{display:flex;flex:1;min-height:0;height:100%;gap:0;}
.sa-nav{width:240px;flex-shrink:0;border-right:0.5px solid var(--brd2);background:var(--sur);overflow-y:auto;padding:12px 8px;}
.sa-tab{display:block;padding:9px 14px;margin:2px 0;border-radius:8px;color:var(--mu);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;user-select:none;line-height:1.35;border:none;background:none;width:100%;text-align:left;font-family:var(--font);}
.sa-tab:hover{background:rgba(255,255,255,.05);color:var(--tx);}
.sa-tab.active{background:var(--ac);color:#fff;}
.sa-tab.active:hover{background:var(--ac);}
.sa-display{flex:1;min-width:0;overflow-y:auto;padding:24px;}
.sa-pane-head{display:flex;align-items:center;margin-bottom:16px;}
.sa-pane-title{color:var(--tx);font-size:16px;font-weight:600;}
.sa-nav-trigger{display:none;background:var(--sur2);border:none;border-radius:8px;padding:0;width:36px;height:36px;align-items:center;justify-content:center;color:var(--tx);cursor:pointer;transition:background .12s;}
.sa-nav-trigger:hover{background:var(--sur);}
.sa-nav-trigger svg{width:18px;height:18px;}
.sa-nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;opacity:0;pointer-events:none;transition:opacity .22s ease;}
.sa-nav-backdrop.open{opacity:1;pointer-events:auto;}
@media (max-width:960px) and (min-width:641px){
  .sa-nav{width:200px;padding:12px 6px;}
  .sa-tab{padding:8px 10px;font-size:12.5px;}
}
@media (max-width:640px){
  .sa-nav-trigger{display:inline-flex;}
  .sa-body{flex-direction:column;}
  .sa-nav{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;height:100vh;z-index:100;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 12px 32px rgba(0,0,0,.45);}
  .sa-nav.open{transform:translateX(0);}
  .sa-display{padding:16px;overflow-y:visible;}
}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <button class="back-btn" onclick="location.href='settings.html'" aria-label="Back to Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Settings
    </button>
    <span class="set-page-title"></span>
    <div class="sp"></div>
    <button class="sa-nav-trigger" onclick="saNavOpen()" aria-label="Open sections menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
  </div>
  <div class="sa-body">
    <div class="sa-nav-backdrop" id="sa-nav-backdrop" onclick="saNavClose()"></div>
    <aside class="sa-nav" id="sa-nav"></aside>
    <div class="sa-display" id="sa-display"></div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>
BuySmartShell.init({ page: 'settings', title: 'Script Alert' });

var saAuctions = [
  { id:1,  active:true,  name:'Manheim' },
  { id:2,  active:true,  name:'ADESA' },
  { id:3,  active:false, name:'IAA' },
  { id:4,  active:true,  name:'Copart' },
  { id:5,  active:true,  name:'ACV Auctions' },
  { id:6,  active:true,  name:'OVE (Openlane)' },
  { id:7,  active:false, name:'SmartAuction' },
  { id:8,  active:true,  name:'TradeRev' },
  { id:9,  active:true,  name:'BacklotCars' },
  { id:10, active:true,  name:'America\'s Auto Auction' },
  { id:11, active:false, name:'Dealers Auto Auction' },
  { id:12, active:true,  name:'ServNet' },
  { id:13, active:true,  name:'Edge Pipeline' },
  { id:14, active:false, name:'EBlock' },
  { id:15, active:true,  name:'CarOffer' }
];

var saSelectedId = null;

function saEsc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function saActiveAuctions(){ return saAuctions.filter(function(a){ return a.active; }); }

function saRenderNav(){
  var list = saActiveAuctions();
  var html = '';
  for(var i = 0; i < list.length; i++){
    var a = list[i];
    var cls = 'sa-tab' + (a.id === saSelectedId ? ' active' : '');
    html += '<button class="' + cls + '" onclick="saSelect(' + a.id + ')">' + saEsc(a.name) + '</button>';
  }
  document.getElementById('sa-nav').innerHTML = html;
}

function saRenderDisplay(){
  var a = saAuctions.find(function(x){ return x.id === saSelectedId; });
  if(!a){ document.getElementById('sa-display').innerHTML = ''; return; }
  var html = '<div class="sa-pane-head"><div class="sa-pane-title">' + saEsc(a.name) + '</div></div>';
  document.getElementById('sa-display').innerHTML = html;
}

function saSelect(id){
  saSelectedId = id;
  saRenderNav();
  saRenderDisplay();
  saNavClose();
}

function saNavOpen(){
  document.getElementById('sa-nav').classList.add('open');
  document.getElementById('sa-nav-backdrop').classList.add('open');
}
function saNavClose(){
  document.getElementById('sa-nav').classList.remove('open');
  document.getElementById('sa-nav-backdrop').classList.remove('open');
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') saNavClose();
});

var saFirst = saActiveAuctions();
if(saFirst.length) saSelect(saFirst[0].id);
</script>

</body>
</html>
