<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Number Assignment — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.set-scroll .table-wrap{margin:0;}
.set-scroll .tfooter{margin:0;padding-top:14px;}

.pn-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.pn-search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;max-width:380px;height:42px;
  padding:0 13px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;transition:border-color .15s;}
.pn-search:focus-within{border-color:var(--ac);}
.pn-search svg{width:15px;height:15px;color:var(--mu);flex-shrink:0;}
.pn-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--font);font-size:13px;}
.pn-search input::placeholder{color:var(--mu);}
.pn-assigned{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  font-size:13px;color:var(--tx);white-space:nowrap;}
.pn-box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--brd2);background:var(--sur2);
  display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
.pn-assigned:hover .pn-box{border-color:var(--ac);}
.pn-box.on{background:var(--ac);border-color:var(--ac);}
.pn-box.on::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg);margin-top:-2px;}
.pn-get{height:42px;padding:0 16px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;
  color:var(--tx);font:500 13px/1 var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.pn-get:hover{border-color:var(--ac);color:var(--ac2);}
.pn-add{display:flex;align-items:center;gap:7px;margin-left:auto;height:42px;padding:0 18px;background:var(--ac);
  border:none;border-radius:10px;color:#fff;font:600 13px/1 var(--font);cursor:pointer;transition:background .15s;white-space:nowrap;}
.pn-add:hover{background:var(--ac2);}
.pn-add svg{width:14px;height:14px;}

.pn-assign{color:var(--tx);}
.pn-number{color:var(--tx);font-family:var(--mono);font-size:12.5px;}
.pn-admin{color:var(--ac2);}
.pn-admin.none{color:var(--mu);}
.pn-sid{color:var(--mu);font-family:var(--mono);font-size:11.5px;}
.pn-kebab{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:transparent;border:none;border-radius:7px;color:var(--mu);cursor:pointer;transition:background .12s,color .12s;}
.pn-kebab:hover{background:var(--hover);color:var(--tx);}
.pn-kebab svg{width:15px;height:15px;}
.pn-menu{display:none;position:fixed;z-index:200;min-width:150px;background:var(--sur);
  border:0.5px solid var(--brd2);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;}
.pn-menu.open{display:block;}
.pn-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:0 13px;min-height:38px;
  background:none;border:none;border-bottom:0.5px solid var(--brd);color:var(--tx);
  font:500 12.5px/1 var(--font);cursor:pointer;text-align:left;}
.pn-menu-item:last-child{border-bottom:none;}
.pn-menu-item:hover{background:var(--hover);color:var(--ac2);}
.pn-menu-item.danger:hover{color:var(--rd);}
.pn-menu-item svg{width:14px;height:14px;color:var(--mu);flex-shrink:0;}
.pn-menu-item:hover svg{color:inherit;}
.pn-empty{padding:34px 12px;text-align:center;color:var(--mu);font-size:12.5px;}

/* Available numbers list in the Get Phone # modal */
.pn-avail{display:flex;flex-direction:column;gap:8px;}
.pn-avail-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sur2);
  border:0.5px solid var(--brd2);border-radius:9px;}
.pn-avail-num{flex:1;min-width:0;font-family:var(--mono);font-size:13px;color:var(--tx);}
.pn-avail-region{font-size:11.5px;color:var(--mu);}
.pn-avail-btn{height:30px;padding:0 12px;background:var(--ac);border:none;border-radius:7px;color:#fff;
  font:600 11.5px/1 var(--font);cursor:pointer;}
.pn-avail-btn:hover{background:var(--ac2);}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
  </div>

  <div class="set-scroll">

    <div class="pn-bar">
      <label class="pn-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input id="pn-search" placeholder="Search phone numbers..." oninput="pnSearchChanged()"/>
      </label>
      <span class="pn-assigned" onclick="pnToggleAssigned()" role="checkbox" aria-checked="true" id="pn-assigned-wrap">
        <span class="pn-box on" id="pn-assigned-box"></span>
        Assigned
      </span>
      <button class="pn-get" onclick="pnGetOpen()">Get Phone #</button>
      <button class="pn-add" onclick="pnOpenAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Phone Number
      </button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:70px;">No.</th>
              <th style="width:200px;">Assign Number</th>
              <th style="width:160px;">Phone Number</th>
              <th style="width:170px;">Admin</th>
              <th style="width:300px;">Phone Number SID</th>
              <th style="width:300px;">Account SID</th>
              <th style="width:300px;">TwiML App SID</th>
              <th style="width:90px;text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="pn-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="tfooter">
      <span id="pn-range">0–0 of 0</span>
      <div class="pgn" id="pn-pager"></div>
    </div>

  </div>
</div>

<!-- Row actions menu -->
<div class="pn-menu" id="pn-menu">
  <button class="pn-menu-item" onclick="pnMenuEdit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Edit
  </button>
  <button class="pn-menu-item danger" onclick="pnMenuDelete()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    Delete
  </button>
</div>

<!-- Add / edit assignment -->
<div class="modal-backdrop modal-fullscreen-mobile" id="pn-modal" onclick="if(event.target===this) pnClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="pn-modal-title">Add Phone Number</div>
      <button class="modal-close" onclick="pnClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div>
        <label class="modal-field-label" for="pn-f-assign">Assign Number</label>
        <div class="modal-field"><input id="pn-f-assign" placeholder="e.g. sales or a user name"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="pn-f-number">Phone Number</label>
        <div class="modal-field"><input id="pn-f-number" placeholder="8327893422" inputmode="tel"/></div>
      </div>
      <div>
        <label class="modal-field-label" for="pn-f-admin">Admin</label>
        <div class="modal-field"><select id="pn-f-admin"></select></div>
      </div>
      <div>
        <label class="modal-field-label" for="pn-f-sid">Phone Number SID</label>
        <div class="modal-field"><input id="pn-f-sid" placeholder="PN…"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="pnClose()">Cancel</button>
      <button class="modal-save" id="pn-modal-save" onclick="pnSave()">Add number</button>
    </div>
  </div>
</div>

<!-- Get phone # -->
<div class="modal-backdrop modal-fullscreen-mobile" id="pn-get-modal" onclick="if(event.target===this) pnGetClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Get Phone #</div>
      <button class="modal-close" onclick="pnGetClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="pn-avail" id="pn-avail-list"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="pnGetClose()">Close</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'Phone Number Assignment' });</script>
<script>
// Placeholder SIDs — never commit real Twilio identifiers
var ACCOUNT_SID = 'ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';
var TWIML_APP_SID = 'APxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';
var ADMINS = ['Amin Hussain', 'Amin Hussain FL', 'Amin Hussain DS'];

// Deterministic pseudo-random hex so SIDs look real but stay stable across reloads
var pnSeed = 20260925;
function pnRand(){
  pnSeed = (pnSeed * 1103515245 + 12345) & 0x7fffffff;
  return pnSeed / 0x7fffffff;
}
function pnHex(len){
  var s = '';
  while(s.length < len) s += Math.floor(pnRand() * 16).toString(16);
  return s;
}
function pnPhone(){
  var area = [832, 325, 346, 254, 713, 281, 409, 936][Math.floor(pnRand() * 8)];
  return String(area) + String(Math.floor(2000000 + pnRand() * 7999999)).slice(0, 7);
}

var NUMBERS = [
  { assign:'Amin Hussain',       number:'2544574533', admin:'Amin Hussain', sid:'PN4135bdc3cf8b7d00f82a7146ec4eebbe' },
  { assign:'Admin',              number:'3253124123', admin:'',             sid:'PNb1c69c84c7304863451d85558b45b7cb' },
  { assign:'sales',              number:'8327893422', admin:'Amin Hussain', sid:'PN1ee34a8baad5c54a5aa9f0aaf4ee89cc' },
  { assign:'Nicolas Sanchez',    number:'8322410304', admin:'Amin Hussain', sid:'PN00735b2df086e0e3d5ecf728eec75397' },
  { assign:'Hardik Patadiya',    number:'3256663030', admin:'Amin Hussain', sid:'PN1e8e699fa9dc31d90f367be599f4844a' },
  { assign:'Jorge Romero',       number:'3466169717', admin:'Amin Hussain', sid:'PNd9a9fa471456026fa2e634c18333180e' },
  { assign:'Omar Salazar',       number:'8328628306', admin:'Amin Hussain', sid:'PNe2d423700e1dc1f2722fed2bc8bd63a5' },
  { assign:'Elmer Reyes',        number:'8329650361', admin:'Amin Hussain', sid:'PN710c9acb47cba9091a37e4207d50a4b4' },
  { assign:'Alejandra Gutierrez',number:'8322407733', admin:'Amin Hussain', sid:'PN99df8d2ba5c1d48db164f72dc253fe4b' },
  { assign:'Kayla Authur',       number:'8329374958', admin:'Amin Hussain', sid:'PN050c420507d4d660e1e7c8d51bb71567' }
];

['Marcos Rivera','Diana Flores','Kevin Nguyen','Priya Patel','Luis Ortega','Brenda Loredo','Jane Peras',
 'Tomas Herrera','Grace Kim','Andre Wilson','Sofia Castillo','Ethan Brooks','Maria Delgado','Chris Vaughn',
 'Natalie Cruz','Victor Ramos','Hannah Lee','Derek Shaw','Camila Rojas','Isaac Moreno','Olivia Bennett',
 'Ruben Salinas','Tanya Willis','Pedro Guzman','Erin Mitchell','Sam Okafor','Lucia Navarro','Trevor Hayes',
 'Bianca Ford','Julian Reyes','support','service','parts','finance','reception','marketing','dispatch',
 'overflow','callback','voicemail','afterhours','spanish','trade-ins','internet','bdc','loaner']
.forEach(function(name){
  NUMBERS.push({
    assign: name,
    number: pnPhone(),
    admin: ADMINS[Math.floor(pnRand() * ADMINS.length)],
    sid: 'PN' + pnHex(32)
  });
});

NUMBERS = NUMBERS.map(function(n, i){
  return { id:i+1, assign:n.assign, number:n.number, admin:n.admin, sid:n.sid,
           account:ACCOUNT_SID, twiml:TWIML_APP_SID };
});

document.getElementById('pn-f-admin').innerHTML =
  '<option value="">Unassigned</option>' +
  ADMINS.map(function(a){ return '<option value="' + a + '">' + a + '</option>'; }).join('');

var PN_PAGE_SIZE = 10;
var pnPage = 1;
var pnAssignedOnly = true;

function pnEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pnFiltered(){
  var q = (document.getElementById('pn-search').value || '').toLowerCase().trim();
  return NUMBERS.filter(function(n){
    if(pnAssignedOnly && !n.admin) return false;
    if(!q) return true;
    return (n.assign + ' ' + n.number + ' ' + n.admin + ' ' + n.sid).toLowerCase().indexOf(q) >= 0;
  });
}

function pnSearchChanged(){ pnPage = 1; pnRender(); }
function pnToggleAssigned(){
  pnAssignedOnly = !pnAssignedOnly;
  document.getElementById('pn-assigned-box').classList.toggle('on', pnAssignedOnly);
  document.getElementById('pn-assigned-wrap').setAttribute('aria-checked', pnAssignedOnly ? 'true' : 'false');
  pnPage = 1;
  pnRender();
}

function pnRender(){
  var rows = pnFiltered();
  var pages = Math.max(1, Math.ceil(rows.length / PN_PAGE_SIZE));
  if(pnPage > pages) pnPage = pages;
  var start = (pnPage - 1) * PN_PAGE_SIZE;
  var pageRows = rows.slice(start, start + PN_PAGE_SIZE);

  var tb = document.getElementById('pn-tbody');
  if(!pageRows.length){
    tb.innerHTML = '<tr><td colspan="8"><div class="pn-empty">No phone numbers match your filters.</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function(n, i){
      return '<tr>' +
        '<td>' + (start + i + 1) + '</td>' +
        '<td class="pn-assign">' + pnEscape(n.assign) + '</td>' +
        '<td class="pn-number">' + pnEscape(n.number) + '</td>' +
        '<td class="pn-admin' + (n.admin ? '' : ' none') + '">' + pnEscape(n.admin || '—') + '</td>' +
        '<td class="pn-sid">' + pnEscape(n.sid) + '</td>' +
        '<td class="pn-sid">' + pnEscape(n.account) + '</td>' +
        '<td class="pn-sid">' + pnEscape(n.twiml) + '</td>' +
        '<td style="text-align:center;">' +
          '<button class="pn-kebab" onclick="pnOpenMenu(event,' + n.id + ')" aria-label="Actions for ' + pnEscape(n.number) + '">' +
            '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  var from = rows.length ? start + 1 : 0;
  var to = Math.min(start + PN_PAGE_SIZE, rows.length);
  document.getElementById('pn-range').textContent = from + '–' + to + ' of ' + rows.length;
  pnRenderPager(pages);
}

function pnRenderPager(pages){
  var nums = [];
  if(pages <= 7){
    for(var p = 1; p <= pages; p++) nums.push(p);
  } else if(pnPage <= 5){
    nums = [1,2,3,4,5,'…',pages];
  } else if(pnPage >= pages - 4){
    nums = [1,'…',pages-4,pages-3,pages-2,pages-1,pages];
  } else {
    nums = [1,'…',pnPage-1,pnPage,pnPage+1,'…',pages];
  }
  var html = '<button class="pb" onclick="pnGo(' + (pnPage-1) + ')"' + (pnPage === 1 ? ' disabled' : '') + ' aria-label="Previous page">&#x2039;</button>';
  nums.forEach(function(n){
    html += n === '…'
      ? '<span class="pager-ell">…</span>'
      : '<button class="pb' + (n === pnPage ? ' on' : '') + '" onclick="pnGo(' + n + ')">' + n + '</button>';
  });
  html += '<button class="pb" onclick="pnGo(' + (pnPage+1) + ')"' + (pnPage === pages ? ' disabled' : '') + ' aria-label="Next page">&#x203A;</button>';
  document.getElementById('pn-pager').innerHTML = html;
}

function pnGo(p){
  var pages = Math.max(1, Math.ceil(pnFiltered().length / PN_PAGE_SIZE));
  pnPage = Math.min(Math.max(1, p), pages);
  pnRender();
  document.querySelector('.set-scroll').scrollTop = 0;
}

function pnFind(id){ return NUMBERS.filter(function(n){ return n.id === id; })[0]; }

// -- Row actions menu --
var pnMenu = document.getElementById('pn-menu');
var pnMenuId = null;

function pnOpenMenu(e, id){
  e.stopPropagation();
  var wasOpen = pnMenu.classList.contains('open') && pnMenuId === id;
  pnCloseMenu();
  if(wasOpen) return;
  pnMenuId = id;
  pnMenu.classList.add('open');
  var r = e.currentTarget.getBoundingClientRect();
  var w = pnMenu.offsetWidth, h = pnMenu.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  pnMenu.style.left = left + 'px';
  pnMenu.style.top = top + 'px';
}
function pnCloseMenu(){ pnMenu.classList.remove('open'); pnMenuId = null; }
function pnMenuEdit(){ var id = pnMenuId; pnCloseMenu(); if(id !== null) pnOpenEdit(id); }
function pnMenuDelete(){
  var n = pnFind(pnMenuId);
  pnCloseMenu();
  if(!n) return;
  NUMBERS = NUMBERS.filter(function(x){ return x.id !== n.id; });
  pnRender();
  window.showNavToast('Number Deleted', n.number + ' has been deleted.');
}

pnMenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', pnCloseMenu);
window.addEventListener('resize', pnCloseMenu);
document.querySelector('.set-scroll').addEventListener('scroll', pnCloseMenu);

// -- Add / edit --
var pnModal = document.getElementById('pn-modal');
var pnEditId = null;

function pnOpenAdd(){
  pnEditId = null;
  document.getElementById('pn-modal-title').textContent = 'Add Phone Number';
  document.getElementById('pn-modal-save').textContent = 'Add number';
  document.getElementById('pn-f-assign').value = '';
  document.getElementById('pn-f-number').value = '';
  document.getElementById('pn-f-admin').value = '';
  document.getElementById('pn-f-sid').value = 'PN' + pnHex(32);
  pnModal.classList.add('open');
}
function pnOpenEdit(id){
  var n = pnFind(id);
  if(!n) return;
  pnEditId = id;
  document.getElementById('pn-modal-title').textContent = 'Edit Phone Number';
  document.getElementById('pn-modal-save').textContent = 'Save changes';
  document.getElementById('pn-f-assign').value = n.assign;
  document.getElementById('pn-f-number').value = n.number;
  document.getElementById('pn-f-admin').value = n.admin;
  document.getElementById('pn-f-sid').value = n.sid;
  pnModal.classList.add('open');
}
function pnClose(){ pnModal.classList.remove('open'); pnEditId = null; }
function pnSave(){
  var numEl = document.getElementById('pn-f-number');
  var number = numEl.value.trim();
  if(!number){ numEl.focus(); return; }
  var data = {
    assign: document.getElementById('pn-f-assign').value.trim() || 'Unassigned',
    number: number,
    admin: document.getElementById('pn-f-admin').value,
    sid: document.getElementById('pn-f-sid').value.trim() || ('PN' + pnHex(32))
  };
  if(pnEditId !== null){
    var n = pnFind(pnEditId);
    if(n){ Object.keys(data).forEach(function(k){ n[k] = data[k]; }); }
    pnRender();
    pnClose();
    window.showNavToast('Number Updated', number + ' has been updated.');
    return;
  }
  var maxId = NUMBERS.reduce(function(m, x){ return Math.max(m, x.id); }, 0);
  data.id = maxId + 1;
  data.account = ACCOUNT_SID;
  data.twiml = TWIML_APP_SID;
  NUMBERS.unshift(data);
  pnPage = 1;
  pnRender();
  pnClose();
  window.showNavToast('Number Added', number + ' has been added.');
}

// -- Get phone # (buy a new number) --
var pnGetModal = document.getElementById('pn-get-modal');
var pnAvailable = [];

function pnGetOpen(){
  pnAvailable = [];
  var regions = ['Houston, TX', 'Dallas, TX', 'Austin, TX', 'San Antonio, TX', 'El Paso, TX'];
  for(var i = 0; i < 5; i++){
    pnAvailable.push({ number: pnPhone(), region: regions[i % regions.length] });
  }
  pnAvailRender();
  pnGetModal.classList.add('open');
}
function pnAvailRender(){
  var list = document.getElementById('pn-avail-list');
  if(!pnAvailable.length){
    list.innerHTML = '<div class="pn-empty">No numbers left in this search.</div>';
    return;
  }
  list.innerHTML = pnAvailable.map(function(a, i){
    return '<div class="pn-avail-row">' +
      '<span class="pn-avail-num">' + pnEscape(a.number) + '</span>' +
      '<span class="pn-avail-region">' + pnEscape(a.region) + '</span>' +
      '<button class="pn-avail-btn" onclick="pnClaim(' + i + ')">Add</button>' +
    '</div>';
  }).join('');
}
function pnClaim(i){
  var a = pnAvailable[i];
  if(!a) return;
  var maxId = NUMBERS.reduce(function(m, x){ return Math.max(m, x.id); }, 0);
  NUMBERS.unshift({ id:maxId+1, assign:'Unassigned', number:a.number, admin:'',
                    sid:'PN' + pnHex(32), account:ACCOUNT_SID, twiml:TWIML_APP_SID });
  pnAvailable.splice(i, 1);
  pnAvailRender();
  pnPage = 1;
  pnRender();
  window.showNavToast('Number Added', a.number + ' is now in your account.');
}
function pnGetClose(){ pnGetModal.classList.remove('open'); }

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ pnCloseMenu(); pnClose(); pnGetClose(); }
});

pnRender();
</script>

</body>
</html>
