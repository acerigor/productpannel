<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Vendors Group — CorePanel</title>
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/settings.css">
<link rel="stylesheet" href="shared/contact-panel.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1117;margin:0;padding:0;font-family:'DM Sans',sans-serif;}
.root.main-area{height:calc(100vh - 64px);min-height:0;overflow:hidden;display:flex;flex-direction:column;}
@media (max-width:640px){ .root.main-area{height:auto;min-height:0;overflow:visible;} }
.set-scroll{flex:1;overflow-y:auto;padding:24px 24px 60px;}
@media (max-width:640px){.set-scroll{padding:20px 16px 40px;}}
.set-scroll .table-wrap{margin:0;}
.set-scroll .tfooter{margin:0;padding-top:14px;}

.vg-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.vg-search{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;max-width:420px;height:42px;
  padding:0 13px;background:var(--sur2);border:0.5px solid var(--brd2);border-radius:10px;transition:border-color .15s;}
.vg-search:focus-within{border-color:var(--ac);}
.vg-search svg{width:15px;height:15px;color:var(--mu);flex-shrink:0;}
.vg-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);
  font-family:var(--font);font-size:13px;}
.vg-search input::placeholder{color:var(--mu);}
.vg-add{display:flex;align-items:center;gap:7px;margin-left:auto;height:42px;padding:0 18px;background:var(--ac);
  border:none;border-radius:10px;color:#fff;font:600 13px/1 var(--font);cursor:pointer;transition:background .15s;white-space:nowrap;}
.vg-add:hover{background:var(--ac2);}
.vg-add svg{width:14px;height:14px;}

.vg-name{color:var(--tx);}
.vg-eye{width:32px;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:var(--sur2);border:0.5px solid var(--brd2);border-radius:7px;color:var(--mu);cursor:pointer;transition:all .12s;}
.vg-eye:hover{color:var(--ac2);border-color:var(--ac);}
.vg-eye svg{width:15px;height:15px;}
.vg-kebab{width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:transparent;border:none;border-radius:7px;color:var(--mu);cursor:pointer;transition:background .12s,color .12s;}
.vg-kebab:hover{background:var(--hover);color:var(--tx);}
.vg-kebab svg{width:15px;height:15px;}
.vg-menu{display:none;position:fixed;z-index:200;min-width:150px;background:var(--sur);
  border:0.5px solid var(--brd2);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;}
.vg-menu.open{display:block;}
.vg-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:0 13px;min-height:38px;
  background:none;border:none;border-bottom:0.5px solid var(--brd);color:var(--tx);
  font:500 12.5px/1 var(--font);cursor:pointer;text-align:left;}
.vg-menu-item:last-child{border-bottom:none;}
.vg-menu-item:hover{background:var(--hover);color:var(--ac2);}
.vg-menu-item.danger:hover{color:var(--rd);}
.vg-menu-item svg{width:14px;height:14px;color:var(--mu);flex-shrink:0;}
.vg-menu-item:hover svg{color:inherit;}
.vg-empty{padding:34px 12px;text-align:center;color:var(--mu);font-size:12.5px;}

/* Phone list inside the modal */
.vg-phones{display:flex;flex-direction:column;gap:8px;}
.vg-phone-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sur2);
  border:0.5px solid var(--brd2);border-radius:9px;}
.vg-phone-num{flex:1;min-width:0;font-family:var(--mono);font-size:13px;color:var(--tx);}
.vg-phone-del{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;
  border:none;border-radius:6px;color:var(--rd);cursor:pointer;opacity:.75;}
.vg-phone-del:hover{opacity:1;background:rgba(232,85,85,.12);}
.vg-phone-del svg{width:14px;height:14px;}
.vg-phone-empty{padding:16px;text-align:center;color:var(--mu);font-size:12.5px;
  border:0.5px dashed var(--brd2);border-radius:9px;}
.vg-phone-add{display:flex;gap:8px;margin-top:4px;}
.vg-phone-add .modal-field{flex:1;}
.vg-phone-add button{height:40px;padding:0 14px;background:var(--ac);border:none;border-radius:8px;color:#fff;
  font:600 12.5px/1 var(--font);cursor:pointer;white-space:nowrap;}
.vg-phone-add button:hover{background:var(--ac2);}
</style>
</head>
<body>

<div class="root main-area" id="root">
  <div class="set-page-head">
    <a class="ur-back" href="settings.html" onclick="if(document.referrer.indexOf('settings.html')!==-1){history.back();return false;}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Settings
    </a>
    <span class="set-page-title"></span>
    <div class="sp"></div>
  </div>

  <div class="set-scroll">

    <div class="vg-bar">
      <label class="vg-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input id="vg-search" placeholder="Search vendor groups..." oninput="vgSearchChanged()"/>
      </label>
      <button class="vg-add" onclick="vgOpenAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Vendor Group
      </button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:80px;">No.</th>
              <th>Group Name</th>
              <th style="width:200px;text-align:center;">Vendor Phone</th>
              <th style="width:110px;text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="vg-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="tfooter">
      <span id="vg-range">0–0 of 0</span>
      <div class="pgn" id="vg-pager"></div>
    </div>

  </div>
</div>

<!-- Row actions menu -->
<div class="vg-menu" id="vg-menu">
  <button class="vg-menu-item" onclick="vgMenuEdit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Edit
  </button>
  <button class="vg-menu-item danger" onclick="vgMenuDelete()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    Delete
  </button>
</div>

<!-- Add / edit group -->
<div class="modal-backdrop modal-fullscreen-mobile" id="vg-modal" onclick="if(event.target===this) vgClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="vg-modal-title">Add Vendor Group</div>
      <button class="modal-close" onclick="vgClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div>
        <label class="modal-field-label" for="vg-name">Group Name</label>
        <div class="modal-field"><input id="vg-name" placeholder="e.g. TrueCar"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="vgClose()">Cancel</button>
      <button class="modal-save" id="vg-modal-save" onclick="vgSave()">Add group</button>
    </div>
  </div>
</div>

<!-- Vendor phones -->
<div class="modal-backdrop modal-fullscreen-mobile" id="vg-phone-modal" onclick="if(event.target===this) vgPhoneClose()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="vg-phone-title">Vendor Phone</div>
      <button class="modal-close" onclick="vgPhoneClose()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="vg-phones" id="vg-phone-list"></div>
      <div class="vg-phone-add">
        <div class="modal-field"><input id="vg-phone-input" placeholder="Add a phone number" inputmode="tel"/></div>
        <button onclick="vgPhoneAdd()">Add</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-save" onclick="vgPhoneClose()">Done</button>
    </div>
  </div>
</div>

<script src="shared/notifications.js"></script>
<script src="shared/contact-panel.js"></script>
<script src="shared/search-index.js"></script>
<script src="shared/shell.js"></script>
<script>BuySmartShell.init({ page: 'settings', title: 'CRM Vendors Group' });</script>
<script>
var GROUPS = [
  { id:1,  name:'Cargurus',            phones:['8885551212'] },
  { id:2,  name:'dealercentric.com',   phones:[] },
  { id:3,  name:'Carfax',              phones:['8555550188'] },
  { id:4,  name:'Westlake',            phones:['8885550145','8885550146'] },
  { id:5,  name:'Capitalone',          phones:[] },
  { id:6,  name:'carsforsalemail.com', phones:[] },
  { id:7,  name:'Carzing',             phones:['8445550123'] },
  { id:8,  name:'TrueCar',             phones:['8005550111'] },
  { id:9,  name:'Cars',                phones:[] },
  { id:10, name:'autolist.com',        phones:[] },
  { id:11, name:'CarsDirect',          phones:['8775550134'] },
  { id:12, name:'Edmunds',             phones:[] }
];

var VG_PAGE_SIZE = 10;
var vgPage = 1;

function vgEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function vgFiltered(){
  var q = (document.getElementById('vg-search').value || '').toLowerCase().trim();
  if(!q) return GROUPS;
  return GROUPS.filter(function(g){ return g.name.toLowerCase().indexOf(q) >= 0; });
}

function vgSearchChanged(){ vgPage = 1; vgRender(); }

function vgRender(){
  var rows = vgFiltered();
  var pages = Math.max(1, Math.ceil(rows.length / VG_PAGE_SIZE));
  if(vgPage > pages) vgPage = pages;
  var start = (vgPage - 1) * VG_PAGE_SIZE;
  var pageRows = rows.slice(start, start + VG_PAGE_SIZE);

  var tb = document.getElementById('vg-tbody');
  if(!pageRows.length){
    tb.innerHTML = '<tr><td colspan="4"><div class="vg-empty">No vendor groups match your search.</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function(g, i){
      return '<tr>' +
        '<td>' + (start + i + 1) + '</td>' +
        '<td class="vg-name">' + vgEscape(g.name) + '</td>' +
        '<td style="text-align:center;">' +
          '<button class="vg-eye" onclick="vgPhoneOpen(' + g.id + ')" aria-label="View phones for ' + vgEscape(g.name) + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
          '</button>' +
        '</td>' +
        '<td style="text-align:center;">' +
          '<button class="vg-kebab" onclick="vgOpenMenu(event,' + g.id + ')" aria-label="Actions for ' + vgEscape(g.name) + '">' +
            '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  var from = rows.length ? start + 1 : 0;
  var to = Math.min(start + VG_PAGE_SIZE, rows.length);
  document.getElementById('vg-range').textContent = from + '–' + to + ' of ' + rows.length;
  vgRenderPager(pages);
}

function vgRenderPager(pages){
  var nums = [];
  if(pages <= 7){
    for(var p = 1; p <= pages; p++) nums.push(p);
  } else if(vgPage <= 5){
    nums = [1,2,3,4,5,'…',pages];
  } else if(vgPage >= pages - 4){
    nums = [1,'…',pages-4,pages-3,pages-2,pages-1,pages];
  } else {
    nums = [1,'…',vgPage-1,vgPage,vgPage+1,'…',pages];
  }
  var html = '<button class="pb" onclick="vgGo(' + (vgPage-1) + ')"' + (vgPage === 1 ? ' disabled' : '') + ' aria-label="Previous page">&#x2039;</button>';
  nums.forEach(function(n){
    html += n === '…'
      ? '<span class="pager-ell">…</span>'
      : '<button class="pb' + (n === vgPage ? ' on' : '') + '" onclick="vgGo(' + n + ')">' + n + '</button>';
  });
  html += '<button class="pb" onclick="vgGo(' + (vgPage+1) + ')"' + (vgPage === pages ? ' disabled' : '') + ' aria-label="Next page">&#x203A;</button>';
  document.getElementById('vg-pager').innerHTML = html;
}

function vgGo(p){
  var pages = Math.max(1, Math.ceil(vgFiltered().length / VG_PAGE_SIZE));
  vgPage = Math.min(Math.max(1, p), pages);
  vgRender();
  document.querySelector('.set-scroll').scrollTop = 0;
}

function vgFind(id){ return GROUPS.filter(function(g){ return g.id === id; })[0]; }

// -- Row actions menu --
var vgMenu = document.getElementById('vg-menu');
var vgMenuId = null;

function vgOpenMenu(e, id){
  e.stopPropagation();
  var wasOpen = vgMenu.classList.contains('open') && vgMenuId === id;
  vgCloseMenu();
  if(wasOpen) return;
  vgMenuId = id;
  vgMenu.classList.add('open');
  var r = e.currentTarget.getBoundingClientRect();
  var w = vgMenu.offsetWidth, h = vgMenu.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  vgMenu.style.left = left + 'px';
  vgMenu.style.top = top + 'px';
}
function vgCloseMenu(){ vgMenu.classList.remove('open'); vgMenuId = null; }
function vgMenuEdit(){ var id = vgMenuId; vgCloseMenu(); if(id !== null) vgOpenEdit(id); }
function vgMenuDelete(){ var id = vgMenuId; vgCloseMenu(); if(id !== null) vgDelete(id); }

vgMenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', vgCloseMenu);
window.addEventListener('resize', vgCloseMenu);
document.querySelector('.set-scroll').addEventListener('scroll', vgCloseMenu);

// -- Add / edit group --
var vgModal = document.getElementById('vg-modal');
var vgEditId = null;

function vgOpenAdd(){
  vgEditId = null;
  document.getElementById('vg-modal-title').textContent = 'Add Vendor Group';
  document.getElementById('vg-modal-save').textContent = 'Add group';
  document.getElementById('vg-name').value = '';
  vgModal.classList.add('open');
}
function vgOpenEdit(id){
  var g = vgFind(id);
  if(!g) return;
  vgEditId = id;
  document.getElementById('vg-modal-title').textContent = 'Edit Vendor Group';
  document.getElementById('vg-modal-save').textContent = 'Save changes';
  document.getElementById('vg-name').value = g.name;
  vgModal.classList.add('open');
}
function vgClose(){ vgModal.classList.remove('open'); vgEditId = null; }
function vgSave(){
  var el = document.getElementById('vg-name');
  var name = el.value.trim();
  if(!name){ el.focus(); return; }
  if(vgEditId !== null){
    var g = vgFind(vgEditId);
    if(g) g.name = name;
    vgRender();
    vgClose();
    window.showNavToast('Group Updated', name + ' has been updated.');
    return;
  }
  var maxId = GROUPS.reduce(function(m, x){ return Math.max(m, x.id); }, 0);
  GROUPS.push({ id:maxId+1, name:name, phones:[] });
  vgRender();
  vgClose();
  window.showNavToast('Group Added', name + ' has been added.');
}
function vgDelete(id){
  var g = vgFind(id);
  if(!g) return;
  GROUPS = GROUPS.filter(function(x){ return x.id !== id; });
  vgRender();
  window.showNavToast('Group Deleted', g.name + ' has been deleted.');
}

// -- Vendor phones --
var vgPhoneModal = document.getElementById('vg-phone-modal');
var vgPhoneId = null;

function vgPhoneOpen(id){
  var g = vgFind(id);
  if(!g) return;
  vgPhoneId = id;
  document.getElementById('vg-phone-title').textContent = g.name + ' — Vendor Phone';
  document.getElementById('vg-phone-input').value = '';
  vgPhoneRender();
  vgPhoneModal.classList.add('open');
}
function vgPhoneRender(){
  var g = vgFind(vgPhoneId);
  if(!g) return;
  var list = document.getElementById('vg-phone-list');
  if(!g.phones.length){
    list.innerHTML = '<div class="vg-phone-empty">No phone numbers for this group yet.</div>';
    return;
  }
  list.innerHTML = g.phones.map(function(p, i){
    return '<div class="vg-phone-row">' +
      '<span class="vg-phone-num">' + vgEscape(p) + '</span>' +
      '<button class="vg-phone-del" onclick="vgPhoneRemove(' + i + ')" aria-label="Remove ' + vgEscape(p) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
      '</button>' +
    '</div>';
  }).join('');
}
function vgPhoneAdd(){
  var el = document.getElementById('vg-phone-input');
  var num = el.value.trim();
  if(!num){ el.focus(); return; }
  var g = vgFind(vgPhoneId);
  if(g) g.phones.push(num);
  el.value = '';
  vgPhoneRender();
}
function vgPhoneRemove(i){
  var g = vgFind(vgPhoneId);
  if(!g) return;
  g.phones.splice(i, 1);
  vgPhoneRender();
}
function vgPhoneClose(){ vgPhoneModal.classList.remove('open'); vgPhoneId = null; }

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ vgCloseMenu(); vgClose(); vgPhoneClose(); }
});

vgRender();
</script>

</body>
</html>
